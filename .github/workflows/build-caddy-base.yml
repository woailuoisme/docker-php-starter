name: Build Caddy Base Multi-arch Images

on:
  workflow_dispatch:
    inputs:
      caddy_base_version:
        description: "caddy-base 版本标签"
        required: true
        default: "2.11.4"

env:
  REGISTRY_DOCKERHUB: docker.io/jiaoio
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./caddy-base
          platforms: linux/amd64,linux/arm64
          build-args: |
            CHANGE_SOURCE=false
          push: true
          tags: |
            ${{ env.REGISTRY_DOCKERHUB }}/caddy-base:${{ inputs.caddy_base_version }}
          cache-from: type=registry,ref=${{ env.REGISTRY_DOCKERHUB }}/caddy-base:cache
          cache-to: type=registry,ref=${{ env.REGISTRY_DOCKERHUB }}/caddy-base:cache,mode=max
