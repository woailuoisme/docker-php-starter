; ==============================================================================
; Laravel 13 + PHP 8.5 开发环境 CLI INI 配置
; ==============================================================================

[PHP]
; 基础与时区
date.timezone = Asia/Shanghai
default_charset = "UTF-8"
; 必须包含 'E'，确保 Docker 容器内通过 $_ENV 读取环境变量
variables_order = "EGPCS"
expose_php = On

; 开发环境启用断言（检测代码不变性与异常）
zend.assertions = 1
assert.exception = 1

; 错误显示与报告：开发环境全面开启
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; 内存与超时控制（开发环境宽容设置）
memory_limit = 512M
; CLI 模式设为 0（不限时），便于跑长周期 Artisan 命令、数据迁移与测试
max_execution_time = 0
default_socket_timeout = 60

; 文件上传
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; 路径解析缓存（开发环境缩短缓存时间，便于代码热更新与挂载卷实时生效）
realpath_cache_size = 4M
realpath_cache_ttl = 120

; ==============================================================================
; OPcache 开发环境配置
; ==============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; 核心：开发环境必须开启时间戳验证，代码修改后即时生效
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; 内存与加速文件数
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

; 框架强依赖：必须开启以保留 Laravel 属性注解（Attributes）与反射信息
opcache.save_comments = 1
opcache.enable_file_override = 0

; 开发环境关闭 JIT，保证堆栈调用精准，避免断点调试干扰
opcache.jit = off
opcache.jit_buffer_size = 0

; ==============================================================================
; 数据持久化与连接池配置
; ==============================================================================
[mysqli]
mysqli.allow_persistent = Off

[mysqlnd]
mysqlnd.collect_statistics = On

[PostgreSQL]
pgsql.allow_persistent = Off
pgsql.auto_reset_persistent = On
pgsql.ignore_notice = 0

[redis]
redis.pconnect.pooling_enabled = 1
redis.pconnect.connection_limit = 0
redis.pconnect.echo_check_liveness = 1

[amqp]
amqp.connect_timeout = 10
amqp.read_timeout = 30
amqp.write_timeout = 30
amqp.heartbeat = 60
