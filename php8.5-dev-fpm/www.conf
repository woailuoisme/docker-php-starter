; ==============================================================================
; Laravel 13 + PHP 8.5 开发环境 FPM 进程池配置 (Pool: www)
; ==============================================================================

[global]
; 前台运行（Docker 容器核心要求）
daemonize = no
; 错误日志输出至标准错误流（Docker 收集器）
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; 运行用户与组
user = www-data
group = www-data

; 网络监听地址与端口
listen = 0.0.0.0:9000

; ==============================================================================
; 进程管理（开发环境轻量化，节省宿主机内存）
; ==============================================================================
pm = dynamic
; 开发机适度控制最大进程数
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.process_idle_timeout = 10s
; 频繁回收，防止开发过程中的内存泄漏积累
pm.max_requests = 200

; ==============================================================================
; 请求超时与慢日志（开发环境适配 Xdebug 长时间断点）
; ==============================================================================
; 设为 300s，防止在 IDE 中单步断点调试时 Worker 进程被强杀
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /var/log/php/fpm.slow.log

; ==============================================================================
; 健康检查与状态监控
; ==============================================================================
ping.path = /ping
ping.response = pong
pm.status_path = /status

; ==============================================================================
; 日志与容器环境变量捕获
; ==============================================================================
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}Mkb %C%%"

; 捕获 Worker 进程的标准输出与标准错误
catch_workers_output = yes
decorate_workers_output = no

; 核心：禁止清空环境变量，确保 Laravel 能在 FPM 下正常读取 Docker 环境变量
clear_env = no

; 限制可解析执行的文件扩展名
security.limit_extensions = .php
