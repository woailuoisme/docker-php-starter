# CNB 流水线 — PHP 8.5 多镜像构建与推送
# 并行模型: 每组 1 个 pipeline,内部 jobs 写为对象 → 并行执行
# 过滤模型: 未选中的变体由 Job 层 if 直接跳过(平台原生过滤),流水线列表不再出现多余 pipeline
# 精简手段: YAML 锚点复用公共构建脚本,变体名经 Job env 注入
# 文档: https://docs.cnb.cool/zh/build/grammar.html
#       https://docs.cnb.cool/zh/build/simplify-configuration.html

# ── 公共构建脚本锚点(变体名由 Job env: BUILD_VARIANT 注入)──
.build-script: &build-script |
  set -euo pipefail
  REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
  VARIANT="${BUILD_VARIANT}"
  # 防御: 未注入 BUILD_VARIANT 直接失败,避免构建错误镜像
  [ -n "${VARIANT}" ] || { echo "::error::BUILD_VARIANT not set"; exit 1; }
  docker buildx build \
    --tag "${REGISTRY}:${VARIANT}" \
    --file "./${VARIANT}/Dockerfile" \
    --cache-from "type=registry,ref=${REGISTRY}:${VARIANT}-cache" \
    --cache-to "type=registry,ref=${REGISTRY}:${VARIANT}-cache,mode=max" \
    --push \
    "./${VARIANT}"

# ── Dev 构建: 1 个 pipeline + 8 个并行 Job ────────────────────────────────────
$:
  web_trigger_build_dev:
    build-dev:
      services: [docker]
      stages:
        - name: Docker Build & Push (Dev)
          jobs:
            cli-alpine:
              env: { BUILD_VARIANT: php8.5-dev-cli-alpine }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-cli-alpine"'
              script: *build-script
            cli-trixie:
              env: { BUILD_VARIANT: php8.5-dev-cli-trixie }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-cli-trixie"'
              script: *build-script
            fpm-alpine:
              env: { BUILD_VARIANT: php8.5-dev-fpm-alpine }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-fpm-alpine"'
              script: *build-script
            fpm-trixie:
              env: { BUILD_VARIANT: php8.5-dev-fpm-trixie }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-fpm-trixie"'
              script: *build-script
            franken-alpine:
              env: { BUILD_VARIANT: php8.5-dev-franken-alpine }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-franken-alpine"'
              script: *build-script
            franken-trixie:
              env: { BUILD_VARIANT: php8.5-dev-franken-trixie }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-franken-trixie"'
              script: *build-script
            roadrunner-alpine:
              env: { BUILD_VARIANT: php8.5-dev-roadrunner-alpine }
              if: '[ "${dev_variants:-}" = "all" ] || printf "%s" "${dev_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-dev-roadrunner-alpine"'
              script: *build-script
            roadrunner-trixie:
