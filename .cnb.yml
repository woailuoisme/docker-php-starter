# CNB 流水线 — PHP 8.5 多镜像构建与推送
# 并行模型: 事件下多个 pipeline 并行（CNB 原生调度），未选中的变体秒退跳过
# 精简手段: YAML 锚点复用公共构建脚本，差异经 stage env 注入
# 文档: https://docs.cnb.cool/zh/build/grammar.html
#       https://docs.cnb.cool/zh/build/simplify-configuration.html

# ── 公共构建脚本锚点（差异由 stage env: BUILD_VARIANT / BUILD_INPUT_VAR 注入）──
.build-script: &build-script |
  set -euo pipefail
  REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
  VARIANT="${BUILD_VARIANT}"
  # printenv 直接读取 web_trigger inputs 环境变量（比 eval 更稳，无 shell 陷阱）
  INPUT="$(printenv "${BUILD_INPUT_VAR:-}" 2>/dev/null || true)"
  echo "::notice::diagnose [${BUILD_INPUT_VAR}]=[${INPUT}] VARIANT=[${VARIANT}]"
  # 空值/未注入 → 不构建任何镜像（不再兜底 all，防止误全量构建）
  if [ -z "${INPUT}" ]; then
    echo "::notice::No selection for ${BUILD_INPUT_VAR}, skip ${VARIANT}"
    exit 0
  fi
  # 显式选 all 或列表命中当前变体才构建
  if [ "${INPUT}" != "all" ] && ! printf '%s' "${INPUT}" | tr ',;' '\n' | grep -qxF "${VARIANT}"; then
    echo "::notice::Skipping ${VARIANT} (not selected)"
    exit 0
  fi
  docker buildx build \
    --tag "${REGISTRY}:${VARIANT}" \
    --file "./${VARIANT}/Dockerfile" \
    --cache-from "type=registry,ref=${REGISTRY}:${VARIANT}-cache" \
    --cache-to "type=registry,ref=${REGISTRY}:${VARIANT}-cache,mode=max" \
    --push \
    "./${VARIANT}"

# ── Dev 构建: 8 个 pipeline 并行 ─────────────────────────────────────────────
$:
  web_trigger_build_dev:
    cli-alpine:
      services: [docker]
      stages:
        - name: Docker Build & Push (php8.5-dev-cli-alpine)
          env: { BUILD_VARIANT: php8.5-dev-cli-alpine, BUILD_INPUT_VAR: dev_variants }
          script: *build-script
    cli-trixie:
      services: [docker]
      stages:
        - name: Docker Build & Push (php8.5-dev-cli-trixie)
          env: { BUILD_VARIANT: php8.5-dev-cli-trixie, BUILD_INPUT_VAR: dev_variants }
