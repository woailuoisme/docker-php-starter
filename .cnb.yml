              if: '[ "${prod_variants:-}" = "all" ] || printf "%s" "${prod_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-prod-fpm-alpine"'
              script: *build-script
            fpm-trixie:
              env: { BUILD_VARIANT: php8.5-prod-fpm-trixie }
              if: '[ "${prod_variants:-}" = "all" ] || printf "%s" "${prod_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-prod-fpm-trixie"'
              script: *build-script
            franken-alpine:
              env: { BUILD_VARIANT: php8.5-prod-franken-alpine }
              if: '[ "${prod_variants:-}" = "all" ] || printf "%s" "${prod_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-prod-franken-alpine"'
              script: *build-script
            franken-trixie:
              env: { BUILD_VARIANT: php8.5-prod-franken-trixie }
              if: '[ "${prod_variants:-}" = "all" ] || printf "%s" "${prod_variants:-}" | tr ",;" "\n" | grep -qxF "php8.5-prod-franken-trixie"'
              script: *build-script
            roadrunner-alpine:
