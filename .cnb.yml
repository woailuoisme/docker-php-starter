              script: *build-script

  # ── Caddy 构建: 1 个 pipeline + 1 个 Job ────────────────────────────────────
  web_trigger_build_caddy:
    build-caddy:
      services: [docker]
      stages:
        - name: Docker Build & Push (Caddy)
          jobs:
            caddy-base:
              env: { BUILD_VARIANT: caddy-base }
              if: '[ "${caddy_variants:-}" = "all" ] || printf "%s" "${caddy_variants:-}" | tr ",;" "\n" | grep -qxF "caddy-base"'
              script: *build-script
